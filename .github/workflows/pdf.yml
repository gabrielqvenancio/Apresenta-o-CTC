name: Publicar Documentação PDF na Release

on:
  push:
    tags:
      - 'v*' # Dispara sempre que você enviar uma tag começando com "v" (ex: v1.0.0)

# Permissão necessária para criar a Release e anexar arquivos
permissions:
  contents: write

jobs:
  release-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar Doxygen + Compilar LaTeX para PDF
        uses: mattnotmitt/doxygen-action@v1
        with:
          doxyfile-path: './Doxyfile'
          enable-latex: true

      - name: Criar Release e anexar PDF
        uses: softprops/action-gh-release@v2
        with:
          files: latex/refman.pdf
          generate_release_notes: true

